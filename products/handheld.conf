# handheld -- CachyOS base + our handheld patch stack (taken over from armada), for the AYN Odin 3.
# Fields: https://github.com/wahooli/linux-handheld-aarch64/wiki/Building-and-Publishing#what-a-product-conf-decides

PRODUCT_DESC="Linux for ARM handhelds (CachyOS base + handheld patch stack)"
PRODUCT_BOARDS="AYN Odin 3 (Qualcomm Dragonwing CQ8725S / SM8750), AYANEO Pocket VERT (Snapdragon 8+ Gen 1 / SM8475P)"

# Decides the published filenames; renaming it orphans the package on every device.
PKGBASE=linux-handheld-aarch64

# --- kernel source ----------------------------------------------------------
# cachyos or kernel.org. For the kernel.org A/B also set CACHY_SCHED_OVERRIDE= (BORE is cachyos-only).
KERNEL_SOURCE=cachyos

# Blank = CACHYOS_REF/KERNELORG_REF from sources.env; set it to pin this product alone.
KERNEL_REF=

# kernel.org only: a cachyos tag names its own base, and a contradicting pin is refused.
BASE_VERSION=

# --- config -----------------------------------------------------------------
# Merged in basename order across all of them; later wins.
CONFIG_DIRS=(common shared cachy bore handheld)

# defconfig, or a path to a full .config under config/base/.
CONFIG_BASE=defconfig

# --- patch series -----------------------------------------------------------
SERIES=patches/series.d/handheld.series

# --- boards -----------------------------------------------------------------
DTS=()
DTS_DELTA=()

# A board already in the tree, or added by a series patch, goes here and not in DTS.
DTB=(cq8725s-ayn-odin3.dtb sm8475-ayaneo-pocket-vert.dtb)

# Fetched and dry-run tested, never applied; promote one only once it applies clean.
ROCKNIX_STAGED=(
    0046-arm64-dts-qcom-Add-AYN-CQ8725S-Common.patch
    0047-arm64-dts-qcom-Add-AYN-Odin3.patch
    0051-drm-msm-a6xx-limit-gxpd-votes-to-recovery-in-a8x.patch
    0052-arm64-dts-qcom-cq8725s-ayn-wire-ss-through-redriver.patch
    0601-ROCKNIX-odin3-pwm-fan-sysfs.patch
    0602-ROCKNIX-odin3-rtc-persist-offset-sdam.patch
    0604-arm64-dts-qcom-cq8725s-ayn-enable-swr1-PCM-port-mask.patch
    1003-arm64-dts-qcom-ayn-cq8725s-common-hv-haptics.patch
)

# ROCKNIX publishes no series; searched in order (their SM8750 PKG_PATCH_DIRS plus 7.0).
ROCKNIX_DIRS=(
    "projects/ROCKNIX/devices/SM8750/patches/linux"
    "projects/ROCKNIX/packages/linux/patches/mainline"
    "projects/ROCKNIX/packages/linux/patches/7.0"
    "projects/ROCKNIX/devices/SM8550/patches/linux"
)

# --- installed layout -------------------------------------------------------
# Blank = default: KERNEL_IMAGE=Image (uncompressed; the Odin 3 image builder gzips it),
# KERNEL_IMAGE_DEST=/boot/<image>, INITRAMFS_IMAGE/_FALLBACK=/boot/initramfs-<PKGBASE>{,-fallback}.img,
# DTB_DEST=/boot/dtb/qcom (ALARM's own kernel uses /boot/dtbs/qcom).
KERNEL_IMAGE=
KERNEL_IMAGE_DEST=
# 'yes' also installs usr/lib/modules/<kver>/vmlinuz so mkinitcpio's hook fires; 'no' = mkinitcpio -p by hand.
INSTALL_VMLINUZ=no

INITRAMFS_IMAGE=
INITRAMFS_FALLBACK=
DTB_DEST=

# --- patch sources ----------------------------------------------------------
# The series is ours. An entry with no copy in patches/handheld/ is fetched from
# armada-os/armada at ARMADA_REF; keep a local copy only where ours differs.
# ROCKNIX: only the staged review set.
USE_ARMADA=yes
USE_ROCKNIX=yes

# Armada ships these too, but ours differ: never fetched from armada. Each is
# pinned to the git blob of armada's copy ours diverged from; fetch-patches
# notes when armada's copy at ARMADA_REF no longer matches.
ARMADA_EXCLUDE=(
    0001-pcie-update-sm8550-dtsi.patch=c30b4323a8c32adcf74ab44bfd138ebe614e6ccc
    0010-ASoC-qcom-add-KONKR-Pocket-FIT-WSA2-card.patch=22e068a9da692b0fb3593a39c51ac6a6fd6cfca4
    0028-drm-panel-Add-panel-driver-for-Chipone-ICNA35XX-base.patch=3246c8e9cbaafed48fbb5b6d995f8972b1235497
    0036_ASoC--qcom--sc8280xp-Add-support-for-Primary-I2S.patch=289c05cc7e2bbe5af82c78c03c0a30034565910b
    0040-wifi-ath12k-send-QDSS-config-when-CNSS_QDSS_CFG_MISS.patch=cee5f9ee0b5d4de0a08a9f2ac5ce10f9b2dedef3
    0048-drm-msm-dsi-reparent-byte-pixel-src-to-xo-on-disable.patch=844172185d8a10f7c268a676f26b0752306c84ae
    0051-gpu-panel-add-Pocket-ACE-panel-driver.patch=51bda22ad1a590115d1d505c6d320e6b9093eb5a
    0052-gpu-panel-add-Pocket-DMG-panel-driver.patch=c64de9f671d943c46c9c0652af35d676427e0675
    0056_Xm-Plus-XM91080G-panel.patch=1efa265612d3ba8dfd45f95564e568044742b7e1
    0057_DDIC-CH13726A-panel.patch=b0f5f98d73c982d238e02764b66a5ef93aac745c
    0060-ASoC-qcom-sc8280xp-enable-MI2S-bit-clock-on-BE-startup.patch=921e10d0a0f1eb854b3f6ffba0eec3b14231b918
    0060-backlight-Add-SY7758-LED-driver.patch=aa413718a3a26987ce1a942865c577de0c71e261
    0060-dt-bindings-silergy-sy7758.patch=da5ccb789d09ea40c9bb09a5919da8a49d1376d4
    0063-gpu-drm-panel-add-pocket-fit-panel.patch=4c246c309a0585a16baac612db584ac83064c2f8
    0068-drm-msm-dpu-lutdma-dspp-igc-gamut.patch=638cb56dcc811d08c0e699dcac2b56b945d46b48
    0069-input-misc-add-konkr-sysbtn-MCU-system-buttons.patch=0e39c05941a9daaff21fe7f3a5127b9edf051f04
    0070-arm64-dts-qcom-dpu-lutdma-reg.patch=334e808ff07b03693c4f902a58fa31e6c534d38c
    0121-pmdomain-qcom-rpmhpd-presync-floor-gmu-rails.patch=e9772e92433742df371d872880f1e184a0717eab
    0618-drm-msm-dp-dont-fail-audio-prepare-when-display-off.patch=5806b6cba2b1c837462b1692a24abebe7d32526c
    1006-tty-serial-qcom-geni-mask-non-console-irq-on-suspend.patch=6738c87c8db2dc213cc5a6a2b9c65dfee2b64ed1
)

# BORE from CachyOS/kernel-patches at CACHY_PATCHES_REF; config/bore/ asserts CONFIG_SCHED_BORE.
CACHY_SCHED=bore

# Off: on a cachyos base the OGC scheduler block is already in the tree. USE_OGC_OVERRIDE=yes re-tests it.
USE_OGC=no

# Displace linux-aarch64: with two kernels, an image builder's `ls -d /usr/lib/modules/*/` is a coin flip.
REPLACE_STOCK_KERNEL=yes

# --- publishing -------------------------------------------------------------
# Tags are next-pkgrel.sh's pkgrel floor: unique per product (check.yml), never renamed.
TAG_PREFIX=v
