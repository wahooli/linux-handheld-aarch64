# handheld -- CachyOS base + armada's handheld patch stack, for Arch Linux ARM.
#
# One product is one pacman package family. Sourced by scripts/lib-product.sh
# after sources.env, so anything here overrides the shared defaults. The
# reasoning behind these choices lives in README.md and docs/PATCHES.md.

PRODUCT_DESC="Linux for ARM handhelds (CachyOS base + handheld patch stack)"
PRODUCT_BOARDS="AYN Odin 3 (Qualcomm Dragonwing CQ8725S / SM8750)"

# Decides the published filenames:
#   <PKGBASE>-<pkgver>-<pkgrel>-aarch64.pkg.tar.zst
# Renaming it orphans the package on every device that has it installed.
PKGBASE=linux-handheld-aarch64

# --- kernel source ----------------------------------------------------------
# cachyos     CachyOS/linux release tarball: mainline stable with CachyOS's own
#             branches merged. Signed, one asset.
# kernel.org  pristine mainline, PGP-verified against the release signers.
#             For the A/B, drop the scheduler patch with it:
#             CACHY_SCHED_OVERRIDE= KERNEL_SOURCE_OVERRIDE=kernel.org
KERNEL_SOURCE=cachyos

# Blank = take the ref for this source from sources.env (CACHYOS_REF or
# KERNELORG_REF). Set it to pin this product while another one moves.
KERNEL_REF=

# Pin the base version regardless of the ref. kernel.org only: a cachyos tag
# names its own base, and a pin that disagrees with it is refused.
BASE_VERSION=

# --- config -----------------------------------------------------------------
# Fragment directories under config/, merged over `make defconfig` in BASENAME
# order across the whole union -- so the numeric prefix keeps deciding order:
# 05 identity, 10 hardware, 20 arch-userland (wins collisions), 25+ extras.
CONFIG_DIRS=(common shared cachy bore handheld)

# `defconfig`, or a path to a full .config to start from instead. defconfig plus
# config/common/20-arch-userland.config is what lifts an arm64 defconfig to
# something a distro userland can boot.
CONFIG_BASE=defconfig

# --- patch series -----------------------------------------------------------
# `armada`   take armada's kernel/patches/series at ARMADA_REF, whole -- 135
#            entries, every board they support.
# <path>     a local series file, for a product whose patches have no upstream
#            manifest.
SERIES=armada

# Entries to drop from armada's series. A name that is no longer in their series
# fails the build rather than rotting here. Each entry deserves a note saying
# what it broke.
SERIES_DENY=()

# armada patches that are NOT in armada's series, appended after it. 0900 is
# armada's own USB-adapter-type diagnostic, the only file in their patches/
# directory their series omits. Appended, so nothing order-sensitive fits here.
SERIES_EXTRA=(0900-power-supply-qcom-battmgr-log-usb-adapter-type.patch)

# --- boards -----------------------------------------------------------------
# Board DTS that are not in mainline: armada vendors them plus a delta patch.
# Copied in after the series and patched after that, so they are not series
# entries.
DTS=(cq8725s-ayn-odin3.dts cq8725s-ayn-common.dtsi)
DTS_DELTA=(cq8725s-ayn-odin3.dts.patch cq8725s-ayn-common.dtsi.patch)

# Shipped under /boot/dtb/qcom/. A board whose .dts is already in the tree, or
# is added by a series patch, belongs here and not in DTS.
DTB=(cq8725s-ayn-odin3.dtb)

# ROCKNIX patches armada does not carry: fetched, dry-run tested, never applied
# (they are 7.1.3-based). Promote one into a series only once it applies clean.
ROCKNIX_STAGED=(
    0046-arm64-dts-qcom-Add-AYN-CQ8725S-Common.patch
    0047-arm64-dts-qcom-Add-AYN-Odin3.patch
    0051-drm-msm-a6xx-limit-gxpd-votes-to-recovery-in-a8x.patch
    0052-arm64-dts-qcom-cq8725s-ayn-wire-ss-through-redriver.patch
    0601-ROCKNIX-odin3-pwm-fan-sysfs.patch
    0602-ROCKNIX-odin3-rtc-persist-offset-sdam.patch
    0604-arm64-dts-qcom-cq8725s-ayn-enable-swr1-PCM-port-mask.patch
    1003-arm64-dts-qcom-ayn-cq8725s-common-hv-haptics.patch
)

# ROCKNIX publishes no series; its patches resolve across these directories,
# searched in order. (Their PKG_PATCH_DIRS for SM8750, plus 7.0.)
ROCKNIX_DIRS=(
    "projects/ROCKNIX/devices/SM8750/patches/linux"
    "projects/ROCKNIX/packages/linux/patches/mainline"
    "projects/ROCKNIX/packages/linux/patches/7.0"
    "projects/ROCKNIX/devices/SM8550/patches/linux"
)

# --- installed layout -------------------------------------------------------
# Blank means the default shown, so a product only names what differs.
#
#   KERNEL_IMAGE        make target and the file under arch/arm64/boot/.
#                       Default: Image (uncompressed -- the Odin 3 image builder
#                       gzips it itself and appends the DTBs).
#   KERNEL_IMAGE_DEST   where it is installed.   Default: /boot/<KERNEL_IMAGE>
#   INITRAMFS_IMAGE     mkinitcpio preset default_image.
#                       Default: /boot/initramfs-<PKGBASE>.img
#   INITRAMFS_FALLBACK  preset fallback_image.
#                       Default: /boot/initramfs-<PKGBASE>-fallback.img
#   DTB_DEST            directory the dtbs are installed into.
#                       Default: /boot/dtb/qcom  (ALARM's own kernel uses
#                       /boot/dtbs/qcom -- a product replacing it wants that)
KERNEL_IMAGE=
KERNEL_IMAGE_DEST=
# Also install the image as usr/lib/modules/<kver>/vmlinuz, which is the path
# mkinitcpio's pacman hook triggers on. 'no' means no initramfs is generated on
# install -- run `mkinitcpio -p <pkgbase>` when you want one. 'yes' costs a second
# copy of the image (~53 MiB uncompressed) but makes it automatic.
INSTALL_VMLINUZ=no

INITRAMFS_IMAGE=
INITRAMFS_FALLBACK=
DTB_DEST=

# --- patch sources ----------------------------------------------------------
# ROCKNIX is the fallback for a patch armada names but does not have, and the
# source of the staged set; turning it off also turns off the staged dry-run.
USE_ARMADA=yes
USE_ROCKNIX=yes

# BORE, from CachyOS/kernel-patches at CACHY_PATCHES_REF. Their tarball ships
# EEVDF plus gaming-sched; BORE is the one patch their -bore package adds on top,
# and it is not in the tree. config/bore/ asserts CONFIG_SCHED_BORE, so the two
# fail together if either is missing.
CACHY_SCHED=bore

# Off: on a cachyos base the scheduler block patches/ogc.select selects is
# already in the tree. USE_OGC_OVERRIDE=yes re-tests that -- prepare() reports
# per patch whether it was already present. See docs/PATCHES.md.
USE_OGC=no

# Displace ALARM's stock linux-aarch64 (provides + conflicts) rather than
# installing beside it: two kernels installed means an image builder picking a
# module tree with `ls -d /usr/lib/modules/*/` gets a coin flip.
REPLACE_STOCK_KERNEL=yes

# --- publishing -------------------------------------------------------------
# Published builds are tagged <TAG_PREFIX><pkgver>-<pkgrel>, and those tags are
# the pkgrel floor in next-pkgrel.sh. Must be unique per product (check.yml
# enforces it); a second product uses '<product>/v'.
TAG_PREFIX=v
