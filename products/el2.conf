# el2 -- Lenovo Yoga Slim 7x (X1E80100) booted at EL2 for KVM, installed beside ALARM's linux-aarch64.
# Fields: https://github.com/wahooli/linux-handheld-aarch64/wiki/Building-and-Publishing#what-a-product-conf-decides

PRODUCT_DESC="Linux for the Lenovo Yoga Slim 7x at EL2 (KVM, iris, EC, efivars)"
PRODUCT_BOARDS="Lenovo Yoga Slim 7x (Qualcomm Snapdragon X Elite X1E80100), booted at EL2"

PKGBASE=linux-el2-aarch64

# --- kernel source ----------------------------------------------------------
# CachyOS's branches do not touch what the series patches, so it applies on their tarball.
KERNEL_SOURCE=cachyos
KERNEL_REF=
BASE_VERSION=

# --- config -----------------------------------------------------------------
# A snapshot of the running kernel's config: defconfig is ~2500 symbols short of the distro kernel.
CONFIG_BASE=config/base/el2.config

# No common/: it lifts defconfig to a distro config, which CONFIG_BASE already is.
CONFIG_DIRS=(el2 shared cachy bore)

# --- patch series -----------------------------------------------------------
# Committed under patches/el2/; nothing to fetch.
SERIES=patches/series.d/el2.series

# --- boards -----------------------------------------------------------------
# No vendored DTS: mainline builds the -el2.dtb from the board .dts plus the x1-el2.dtbo overlay.
DTS=()
DTS_DELTA=()
DTB=(x1e80100-lenovo-yoga-slim7x-el2.dtb x1e80100-lenovo-yoga-slim7x.dtb)

ROCKNIX_STAGED=()
ROCKNIX_DIRS=()

# --- installed layout -------------------------------------------------------
# All distinct from linux-aarch64's: pacman refuses co-installed packages that share a file.
KERNEL_IMAGE=Image
KERNEL_IMAGE_DEST=/boot/Image-el2
DTB_DEST=/boot/dtbs-el2/qcom
# 'yes' also installs usr/lib/modules/<kver>/vmlinuz so mkinitcpio's hook fires; 'no' = mkinitcpio -p by hand.
INSTALL_VMLINUZ=no

INITRAMFS_IMAGE=/boot/initramfs-linux-el2.img
INITRAMFS_FALLBACK=/boot/initramfs-linux-el2-fallback.img

# A deliberate divergence from the stock kernel (EEVDF, PREEMPT=y).
CACHY_SCHED=bore

# --- patch sources ----------------------------------------------------------
USE_ARMADA=no
USE_ROCKNIX=no
USE_OGC=no

REPLACE_STOCK_KERNEL=no

# --- publishing -------------------------------------------------------------
# Unique per product: two products on the same base produce the same pkgver.
TAG_PREFIX=el2/v
