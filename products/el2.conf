# el2 -- Lenovo Yoga Slim 7x (X1E80100) booting at EL2, so KVM works.
#
# Installs BESIDE ALARM's stock linux-aarch64 rather than replacing it: on a
# laptop being bisected, the stock kernel is the fallback boot entry. That is
# what REPLACE_STOCK_KERNEL=no below buys, and it is why every installed path
# here is distinct from ALARM's.

PRODUCT_DESC="Linux for the Lenovo Yoga Slim 7x at EL2 (KVM, iris, EC, efivars)"
PRODUCT_BOARDS="Lenovo Yoga Slim 7x (Qualcomm Snapdragon X Elite X1E80100), booted at EL2"

PKGBASE=linux-el2-aarch64

# --- kernel source ----------------------------------------------------------
# The patch series was verified against upstream v7.2 and rebased for 7.2's API
# drift. cachyos-7.2.2-1 is 7.2.2 plus CachyOS's branches, which do not touch
# remoteproc, drivers/soc/qcom, iris or arm64 dts -- so the series applies. Set
# KERNEL_SOURCE=kernel.org to build the same stack on pristine mainline when the
# base is under suspicion.
KERNEL_SOURCE=cachyos
KERNEL_REF=
BASE_VERSION=

# --- config -----------------------------------------------------------------
# The base is a snapshot of the RUNNING kernel's /proc/config.gz, not
# `make defconfig`: this product replaces a distro kernel on a working laptop,
# and every flag it boots with today has to survive. arm64 defconfig is ~2500
# symbols short of that.
CONFIG_BASE=config/base/el2.config

# Only el2 fragments. config/common/ exists to lift an arm64 defconfig up to a
# distro config, which base.config already is -- merging it here would create
# differences from the running kernel rather than remove them.
CONFIG_DIRS=(el2 shared cachy bore)

# --- patch series -----------------------------------------------------------
# Local, and committed under patches/el2/: the upstream branch is dead and there
# is no manifest to take. Resolution order in fetch-patches.sh puts
# patches/<product>/ first, so nothing is fetched for this product.
SERIES=patches/series.d/el2.series

# --- boards -----------------------------------------------------------------
# No vendored DTS: mainline already builds x1e80100-lenovo-yoga-slim7x-el2.dtb
# from the board .dts plus the x1-el2.dtbo overlay (arch/arm64/boot/dts/qcom/
# Makefile), and the series patches that overlay in place.
DTS=()
DTS_DELTA=()
DTB=(x1e80100-lenovo-yoga-slim7x-el2.dtb x1e80100-lenovo-yoga-slim7x.dtb)

ROCKNIX_STAGED=()
ROCKNIX_DIRS=()

# --- installed layout -------------------------------------------------------
# All distinct from ALARM's linux-aarch64 (/boot/Image, /boot/dtbs/qcom/,
# /boot/initramfs-linux-aarch64.img), because the two are co-installed and pacman
# refuses the install on any shared file. The dtb names are the same as ALARM's,
# so the DIRECTORY has to differ.
KERNEL_IMAGE=Image
KERNEL_IMAGE_DEST=/boot/Image-el2
DTB_DEST=/boot/dtbs-el2/qcom
# Also install the image as usr/lib/modules/<kver>/vmlinuz, which is the path
# mkinitcpio's pacman hook triggers on. 'no' means no initramfs is generated on
# install -- run `mkinitcpio -p <pkgbase>` when you want one. 'yes' costs a second
# copy of the image (~53 MiB uncompressed) but makes it automatic.
INSTALL_VMLINUZ=no

INITRAMFS_IMAGE=/boot/initramfs-linux-el2.img
INITRAMFS_FALLBACK=/boot/initramfs-linux-el2-fallback.img

# BORE, same as handheld -- see products/handheld.conf. Note this is a
# deliberate divergence from the running kernel, which is EEVDF with
# CONFIG_PREEMPT=y; config/cachy/ lists the others.
CACHY_SCHED=bore

# --- patch sources ----------------------------------------------------------
# Nothing here comes from armada, ROCKNIX or OGC.
USE_ARMADA=no
USE_ROCKNIX=no
USE_OGC=no

# Co-installed with the stock kernel, not replacing it.
REPLACE_STOCK_KERNEL=no

# --- publishing -------------------------------------------------------------
# NOT a bare 'v' -- that namespace belongs to handheld, and two products on the
# same base produce the same pkgver.
TAG_PREFIX=el2/v
