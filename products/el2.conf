# el2 -- Lenovo Yoga Slim 7x (X1E80100) booting at EL2, so KVM works.
#
# Installs beside ALARM's stock linux-aarch64 rather than replacing it, so the
# stock kernel stays as a fallback boot entry -- which is why every installed
# path here is distinct from ALARM's.

PRODUCT_DESC="Linux for the Lenovo Yoga Slim 7x at EL2 (KVM, iris, EC, efivars)"
PRODUCT_BOARDS="Lenovo Yoga Slim 7x (Qualcomm Snapdragon X Elite X1E80100), booted at EL2"

PKGBASE=linux-el2-aarch64

# --- kernel source ----------------------------------------------------------
# The series is rebased for 7.2, and CachyOS's branches do not touch remoteproc,
# drivers/soc/qcom, iris or arm64 dts, so it applies on their tarball. Set
# KERNEL_SOURCE=kernel.org to build the same stack on pristine mainline.
KERNEL_SOURCE=cachyos
KERNEL_REF=
BASE_VERSION=

# --- config -----------------------------------------------------------------
# A snapshot of the running kernel's /proc/config.gz rather than `make
# defconfig`, which is ~2500 symbols short: this replaces a distro kernel on a
# working laptop, so every flag it boots with today has to survive.
CONFIG_BASE=config/base/el2.config

# No config/common/: it exists to lift an arm64 defconfig up to a distro config,
# which CONFIG_BASE already is. Merging it would create differences from the
# running kernel rather than remove them.
CONFIG_DIRS=(el2 shared cachy bore)

# --- patch series -----------------------------------------------------------
# Local, committed under patches/el2/: the upstream branch is dead and there is
# no manifest to take. patches/<product>/ resolves first, so nothing is fetched.
SERIES=patches/series.d/el2.series

# --- boards -----------------------------------------------------------------
# No vendored DTS: mainline already builds the -el2.dtb from the board .dts plus
# the x1-el2.dtbo overlay, and the series patches that overlay in place.
DTS=()
DTS_DELTA=()
DTB=(x1e80100-lenovo-yoga-slim7x-el2.dtb x1e80100-lenovo-yoga-slim7x.dtb)

ROCKNIX_STAGED=()
ROCKNIX_DIRS=()

# --- installed layout -------------------------------------------------------
# All distinct from ALARM's linux-aarch64, because the two are co-installed and
# pacman refuses the install on any shared file. The dtb names match ALARM's, so
# the directory has to differ.
KERNEL_IMAGE=Image
KERNEL_IMAGE_DEST=/boot/Image-el2
DTB_DEST=/boot/dtbs-el2/qcom
# Also install the image as usr/lib/modules/<kver>/vmlinuz, the path mkinitcpio's
# pacman hook triggers on. 'no' means running `mkinitcpio -p <pkgbase>` by hand;
# 'yes' automates it at the cost of a second copy of the image (~53 MiB).
INSTALL_VMLINUZ=no

INITRAMFS_IMAGE=/boot/initramfs-linux-el2.img
INITRAMFS_FALLBACK=/boot/initramfs-linux-el2-fallback.img

# BORE, same as handheld. A deliberate divergence from the running kernel, which
# is EEVDF with CONFIG_PREEMPT=y.
CACHY_SCHED=bore

# --- patch sources ----------------------------------------------------------
# Nothing here comes from armada, ROCKNIX or OGC.
USE_ARMADA=no
USE_ROCKNIX=no
USE_OGC=no

# Co-installed with the stock kernel, not replacing it.
REPLACE_STOCK_KERNEL=no

# --- publishing -------------------------------------------------------------
# Not a bare 'v': that namespace belongs to handheld, and two products on the
# same base produce the same pkgver.
TAG_PREFIX=el2/v
