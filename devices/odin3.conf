# AYN Odin 3 -- Qualcomm Dragonwing CQ8725S (SM8750 family).
#
# Sourced by scripts/fetch-patches.sh and by the PKGBUILD. Adding a second
# device means adding a file like this one and listing it in DEVICES.

DEVICE_DESC="AYN Odin 3 (Qualcomm Dragonwing CQ8725S / SM8750)"

# Ordered patch manifest for this device.
SERIES="patches/series.d/odin3.series"

# Board device trees. Not in mainline, so armada vendors them verbatim and ships
# a delta patch alongside; we follow that rather than using ROCKNIX's
# "add DTS" patches, because the delta is what makes them match a 7.2 tree.
DTS=(cq8725s-ayn-odin3.dts cq8725s-ayn-common.dtsi)
DTS_DELTA=(cq8725s-ayn-odin3.dts.patch cq8725s-ayn-common.dtsi.patch)

# DTBs to ship in the package, under /boot/dtb/qcom/.
DTB=(cq8725s-ayn-odin3.dtb)

# ROCKNIX-only patches for this device that armada does not carry. Fetched into
# patches/rocknix-staged/ and dry-run tested, NEVER applied -- they are
# 7.1.3-based. When one starts applying cleanly, promote it into SERIES above
# and record it in docs/PATCHES.md.
ROCKNIX_STAGED=(
    0046-arm64-dts-qcom-Add-AYN-CQ8725S-Common.patch
    0047-arm64-dts-qcom-Add-AYN-Odin3.patch
    0051-drm-msm-a6xx-limit-gxpd-votes-to-recovery-in-a8x.patch
    0052-arm64-dts-qcom-cq8725s-ayn-wire-ss-through-redriver.patch
    0601-ROCKNIX-odin3-pwm-fan-sysfs.patch
    0602-ROCKNIX-odin3-rtc-persist-offset-sdam.patch
    0604-arm64-dts-qcom-cq8725s-ayn-enable-swr1-PCM-port-mask.patch
    1003-arm64-dts-qcom-ayn-cq8725s-common-hv-haptics.patch
)

# ROCKNIX resolves patches across several directories; PKG_PATCH_DIRS for SM8750
# is "${LINUX} mainline ${DEVICE} default" plus "7.0". Searched in order.
ROCKNIX_DIRS=(
    "projects/ROCKNIX/devices/SM8750/patches/linux"
    "projects/ROCKNIX/packages/linux/patches/mainline"
    "projects/ROCKNIX/packages/linux/patches/7.0"
    "projects/ROCKNIX/devices/SM8550/patches/linux"
)
