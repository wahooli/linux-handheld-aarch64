name: poll upstreams

# Watches the upstreams and, when any moved, commits the new refs to sources.env
# and kicks off a build.
#
# A poller because Actions cannot receive events from a repository you do not
# own. It commits rather than passing refs to the build so sources.env in git
# history is the complete record of what was built when, and a bad bump is a
# `git revert`.
on:
  schedule:
    # Off the hour: scheduled workflows on the hour queue behind everyone else's
    # cron and can be delayed by 20+ minutes.
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write     # to dispatch build.yml

concurrency:
  group: poll
  cancel-in-progress: true

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check upstreams
        id: poll
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/poll-sources.sh

      # Through the GraphQL API rather than `git commit && git push`, because
      # GitHub signs commits made with a bot token server-side -- so the bump
      # lands Verified and satisfies a "require signed commits" rule, with no key
      # to manage.
      #
      # expectedHeadOid makes this a compare-and-swap: if main moved since the
      # checkout, the mutation fails and the next poll redoes the work against
      # the new head rather than racing.
      - name: Commit new refs
        if: steps.poll.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          # Via env, not inline: SUMMARY is built from upstream tag names, which
          # are third-party strings.
          SUMMARY: ${{ steps.poll.outputs.summary }}
        run: |
          set -euo pipefail
          oid="$(git rev-parse HEAD)"
          gh api graphql \
            -f query='
              mutation($repo: String!, $branch: String!, $oid: GitObjectID!,
                       $headline: String!, $path: String!, $contents: Base64String!) {
                createCommitOnBranch(input: {
                  branch:          { repositoryNameWithOwner: $repo, branchName: $branch },
                  message:         { headline: $headline },
                  expectedHeadOid: $oid,
                  fileChanges:     { additions: [{ path: $path, contents: $contents }] }
                }) { commit { oid url } }
              }' \
            -f repo="${GITHUB_REPOSITORY}" \
            -f branch="${GITHUB_REF_NAME}" \
            -f oid="${oid}" \
            -f headline="chore(sources): ${SUMMARY}" \
            -f path=sources.env \
            -f contents="$(base64 -w0 sources.env)" \
            --jq '.data.createCommitOnBranch.commit | "==> committed \(.oid[0:8])  \(.url)"'

      # A push made with GITHUB_TOKEN does not trigger other workflows, so the
      # build has to be dispatched explicitly.
      - name: Trigger build
        if: steps.poll.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build.yml --ref "${{ github.ref_name }}"

      - name: Summary
        if: ${{ !cancelled() }}
        run: |
          if [ "${{ steps.poll.outcome }}" = "failure" ]; then
            # Most likely a refused bump -- the poller verifies a new ref
            # resolves before committing. sources.env is untouched, so this must
            # not read as "nothing moved".
            echo "Poll failed; sources.env unchanged. See the log." >> "$GITHUB_STEP_SUMMARY"
          elif [ "${{ steps.poll.outputs.changed }}" = "true" ]; then
            echo "Bumped: ${{ steps.poll.outputs.summary }}" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Build dispatched." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No upstream movement." >> "$GITHUB_STEP_SUMMARY"
          fi
