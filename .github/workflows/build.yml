name: build

# workflow_dispatch covers manual runs and the poller's `gh workflow run` -- a
# push made with GITHUB_TOKEN does not trigger other workflows. The push trigger
# covers anything that changes what gets built; docs do not.
on:
  workflow_dispatch:
    inputs:
      product:
        description: 'Product to build (blank = every product in sources.env)'
        type: string
        default: ''
      kernel_source:
        description: 'Override KERNEL_SOURCE for this run (cachyos / kernel.org)'
        type: string
        default: ''
      kernel_ref:
        description: 'Override the kernel ref for this run (cachyos-7.2.2-1, 7.2.2, ...)'
        type: string
        default: ''
      base_version:
        description: 'Pin the base version (kernel.org products only)'
        type: string
        default: ''
      use_ogc:
        description: 'Override USE_OGC for this run (yes/no) -- the overlap experiment'
        type: string
        default: ''
      skip_publish:
        description: 'Build only; do not touch R2, do not tag'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'sources.env'
      - 'products/**'
      - 'PKGBUILD'
      - 'Dockerfile'
      - 'config/**'
      - 'patches/series.d/**'
      # Fetched patches are gitignored, so only committed ones appear here.
      - 'patches/*/*.patch'
      - 'patches/ogc.select'
      - 'patches/ogc.select.deny'
      - 'patches/ogc.keyfpr'
      # Only the scripts that change what gets built. `scripts/**` is too broad:
      # a publish-r2.sh fix would rebuild a byte-identical kernel for fifty
      # minutes before republishing it.
      - 'scripts/lib-product.sh'
      - 'scripts/fetch-patches.sh'
      - 'scripts/build.sh'
      - 'scripts/build-in-container.sh'
      - 'scripts/makepkg-and-report.sh'
      - 'scripts/next-pkgrel.sh'
      # Not build.yml itself: editing it changes how the build is orchestrated,
      # not what comes out. check.yml validates every push cheaply.

permissions:
  contents: write   # push tags, create releases
  issues: write     # open the build-failure issue
  actions: write    # delete superseded ccache entries (see the prune step)

# One publisher at a time, across runs. cancel-in-progress is false because
# cancelling mid-publish could leave R2 holding packages with no database entry,
# or a database referencing a package whose upload was killed.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  # Which products this run builds, and which kernel ref each resolves to. The
  # ref is needed here because the tarball cache is keyed on it.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - name: Resolve products and their kernel refs
        id: plan
        env:
          # Via env, never inline -- a workflow input pasted into a shell
          # command is a shell injection.
          WANT: ${{ inputs.product }}
          KERNEL_SOURCE_OVERRIDE: ${{ inputs.kernel_source }}
          KERNEL_REF_OVERRIDE: ${{ inputs.kernel_ref }}
          BASE_VERSION_OVERRIDE: ${{ inputs.base_version }}
        run: |
          set -euo pipefail
          . ./sources.env
          if [ -n "${WANT}" ]; then
            [ -f "products/${WANT}.conf" ] \
              || { echo "::error::no products/${WANT}.conf"; exit 1; }
            list="${WANT}"
          else
            list="${PRODUCTS}"
          fi
          [ -n "${list}" ] || { echo "::error::no products to build"; exit 1; }

          # Same resolver the build uses, overrides included, so the cache key
          # cannot disagree with what gets downloaded.
          for p in ${list}; do
            # set -e inside the subshell too: without it a refused lp_load still
            # prints a ref from half-loaded state.
            ref="$(PRODUCT="${p}" bash -c '
                set -euo pipefail
                . scripts/lib-product.sh
                lp_load "$PWD" >/dev/null
                lp_resolve_kernel_source "" >/dev/null
                printf "%s" "${KERNEL_REF}"')" \
              || { echo "::error::${p}: product conf and overrides disagree (see above)"; exit 1; }
            [ -n "${ref}" ] || { echo "::error::could not resolve a kernel ref for ${p}"; exit 1; }
            printf '%s\t%s\n' "${p}" "${ref}"
          done > /tmp/plan.tsv
          sed 's/^/  /' /tmp/plan.tsv
          matrix="$(jq -Rn -c '[inputs | split("\t") | {product: .[0], kernelref: .[1]}]' < /tmp/plan.tsv)"
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"
          echo "${matrix}"

  build:
    needs: plan
    # Native aarch64: no qemu, no binfmt, no cross-compilation tax.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    strategy:
      # Nothing here writes shared state: each product has its own pkgbase,
      # pkgrel floor and caches. The pacman database is the only shared thing,
      # written once by the publish job after every build finishes.
      #
      # fail-fast: false so one broken stack does not cancel another build
      # halfway through, and the publish job can still ship what did build.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}

    env:
      PRODUCT: ${{ matrix.product }}

    steps:
      # fetch-tags is required: next-pkgrel.sh floors the pkgrel on the tags,
      # since R2 gets pruned and tags do not. ref is pinned to this run's commit
      # rather than the branch head, so a push landing mid-run cannot make the
      # publish job tag a tree these packages were not built from.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-tags: true
          fetch-depth: 0

      # Weekly rotation, so the builder's toolchain does not drift a year behind
      # the target without rebuilding a rootfs every run.
      - name: Cache key inputs
        id: keys
        run: echo "week=$(date -u +%Y-%U)" >> "$GITHUB_OUTPUT"

      # restore/save rather than actions/cache throughout: actions/cache only
      # writes in its post step, which does not run when the job fails -- so a
      # late failure would discard an hour of compilation.
      - name: Restore builder image
        id: imgcache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/builder-image.tar
          key: builder-${{ hashFiles('Dockerfile') }}-${{ steps.keys.outputs.week }}

      - name: Load or build the builder image
        run: |
          set -euo pipefail
          if [ -f ~/.cache/builder-image.tar ]; then
            docker load -i ~/.cache/builder-image.tar
          else
            docker build -t linux-handheld-builder:latest .
            mkdir -p ~/.cache
            docker save linux-handheld-builder:latest -o ~/.cache/builder-image.tar
          fi

      - name: Save builder image
        if: ${{ !cancelled() && steps.imgcache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/builder-image.tar
          key: builder-${{ hashFiles('Dockerfile') }}-${{ steps.keys.outputs.week }}

      - name: Install host tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          # bsdtar for fetch-patches.sh unpacking series.zip; falls back to unzip
          sudo apt-get install -y -qq libarchive-tools unzip
          # next-pkgrel.sh lists R2 for the pkgrel floor, and with
          # PKGREL_REQUIRE_R2 a missing client is a hard error
          ./scripts/install-rclone.sh

      # Keyed on the kernel ref, not the product, so two products on the same tag
      # share one 265 MB entry against the 10 GB per-repository budget.
      - name: Restore kernel tarball
        id: tarcache
        uses: actions/cache/restore@v6
        with:
          path: .cache
          key: tarball-${{ matrix.kernelref }}

      - name: Resolve the patch stack
        id: fetch
        env:
          KERNEL_SOURCE_OVERRIDE: ${{ inputs.kernel_source }}
          KERNEL_REF_OVERRIDE: ${{ inputs.kernel_ref }}
          BASE_VERSION_OVERRIDE: ${{ inputs.base_version }}
          USE_OGC_OVERRIDE: ${{ inputs.use_ogc }}
        run: ./scripts/fetch-patches.sh

      - name: Save kernel tarball
        if: ${{ !cancelled() && steps.tarcache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: .cache
          key: tarball-${{ matrix.kernelref }}

      # PKGREL_REQUIRE_R2 makes a missing credential or unreadable bucket an
      # error rather than a pkgrel guess.
      - name: Decide pkgrel
        id: ver
        env:
          # 'true'/'false' as a string. Not `skip_publish && '' || '1'` -- an
          # empty string is falsy in a GitHub expression, so the || arm always
          # wins and the flag is always on.
          PKGREL_REQUIRE_R2: ${{ !inputs.skip_publish }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: ./scripts/next-pkgrel.sh

      # Keyed on product and pkgver so a base bump starts clean rather than
      # inheriting a cache full of objects for a different kernel; restore-keys
      # still lets a patch-only rebuild reuse almost everything.
      - name: Restore ccache
        uses: actions/cache/restore@v6
        with:
          path: .ccache
          key: ccache-${{ matrix.product }}-${{ steps.ver.outputs.pkgver }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ matrix.product }}-${{ steps.ver.outputs.pkgver }}-
            ccache-${{ matrix.product }}-

      - name: Build packages
        env:
          # 10 GB of Actions cache per repository, evicted LRU, and entries are
          # immutable -- the sha in the key means every run writes a new one.
          #
          # A full arm64 kernel is ~4.5 GiB of ccache, so 3G is about two thirds
          # of one. Two products at 3G plus the image and the tarball is ~7 GB,
          # which fits only because the prune step below keeps one generation per
          # product. Raise this and the products evict each other again.
          CCACHE_MAXSIZE: 3G
        run: ./scripts/build.sh

      # Immediately after the build, before anything that can fail.
      #
      # !cancelled(), not always(): restore-keys resolves to the most recently
      # created matching entry, so saving on cancellation would let a build
      # killed two minutes in shadow the last complete ccache.
      - name: Save ccache
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: .ccache
          key: ccache-${{ matrix.product }}-${{ steps.ver.outputs.pkgver }}-${{ github.sha }}

      # Cache entries are immutable, so every run leaves its predecessor behind.
      # Unpruned, two products fill the 10 GB budget in about two runs and LRU
      # starts evicting whichever ran less recently, turning a parallel matrix
      # into cold builds. Each job only touches its own prefix, so no race here.
      - name: Prune superseded ccache entries
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          prefix="ccache-${PRODUCT}-"
          gh api --paginate "/repos/${GITHUB_REPOSITORY}/actions/caches?per_page=100" \
            --jq ".actions_caches[] | select(.key | startswith(\"${prefix}\")) | \"\(.created_at)\t\(.id)\t\(.key)\"" \
            | sort -r > /tmp/caches.tsv || true
          total="$(wc -l < /tmp/caches.tsv)"
          echo "  ${total} cache entr(ies) under ${prefix}"
          tail -n +2 /tmp/caches.tsv | while IFS=$'\t' read -r created id key; do
            echo "  delete ${key} (${created})"
            gh api -X DELETE "/repos/${GITHUB_REPOSITORY}/actions/caches/${id}" >/dev/null || true
          done

      - name: Job summary
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          echo "## ${PRODUCT}" >> "$GITHUB_STEP_SUMMARY"
          [ -f .fetch-report.md ]  && cat .fetch-report.md  >> "$GITHUB_STEP_SUMMARY" || true
          [ -f .staged-report.md ] && cat .staged-report.md >> "$GITHUB_STEP_SUMMARY" || true
          if compgen -G 'out/*.pkg.tar.zst' > /dev/null; then
            {
              echo
              echo "### Packages"
              echo
              echo "| package | size |"
              echo "|---|---|"
              for f in out/*.pkg.tar.zst; do
                echo "| \`$(basename "$f")\` | $(du -h "$f" | cut -f1) |"
              done
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # For the publish job: the packages plus the version.env describing them,
      # which is what tag-release.sh needs per product.
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: product-${{ matrix.product }}-${{ steps.ver.outputs.pkgver }}-${{ steps.ver.outputs.pkgrel }}
          path: |
            out/*.pkg.tar.zst
            version.env
            patches/series.generated
          retention-days: 14
          if-no-files-found: warn

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: ./scripts/report-failure.sh

  # One database write per run, after every build finishes. Two products
  # publishing concurrently would each fetch the database, fold their own
  # packages in and upload -- and the later upload would drop the earlier one's
  # entry. Retention pruning also runs once this way.
  publish:
    needs: [plan, build]
    # Fiddly because `!cancelled()` overrides the default "only run if needs
    # succeeded" gate -- with just that, a failed plan left build skipped and
    # publish started anyway.
    #
    #   plan failed / cancelled      -> skipped (nothing was built)
    #   build skipped                -> skipped (same)
    #   build failed for one product -> runs, shipping whichever did build
    if: ${{ !cancelled() && !inputs.skip_publish && needs.plan.result == 'success' && needs.build.result != 'skipped' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-tags: true
          fetch-depth: 0

      - name: Cache key inputs
        id: keys
        run: echo "week=$(date -u +%Y-%U)" >> "$GITHUB_OUTPUT"

      # publish-r2.sh prefers the container's repo-add and vercmp: its pacman is
      # the one that built these packages, and the runner has none. Restored from
      # the same cache the build job wrote.
      - name: Restore builder image
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/builder-image.tar
          key: builder-${{ hashFiles('Dockerfile') }}-${{ steps.keys.outputs.week }}

      - name: Load the builder image
        run: |
          set -euo pipefail
          if [ -f ~/.cache/builder-image.tar ]; then
            docker load -i ~/.cache/builder-image.tar
          else
            echo "::warning::no cached builder image; building it"
            docker build -t linux-handheld-builder:latest .
          fi

      - name: Install rclone
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq unzip
          ./scripts/install-rclone.sh

      # continue-on-error because with every build failed there are no artifacts
      # and this step would bury the real failure under a second one. The collect
      # step's count is the actual gate.
      - uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          pattern: product-*
          path: artifacts

      # Every product's packages in one out/, so repo-add sees them all and the
      # database is written once. Each artifact keeps its own version.env for the
      # tagging step.
      - name: Collect the packages
        id: collect
        run: |
          set -euo pipefail
          mkdir -p out
          n=0
          for d in artifacts/product-*/; do
            [ -d "${d}" ] || continue
            [ -f "${d}version.env" ] || { echo "::warning::${d} has no version.env; skipping"; continue; }
            for f in "${d}"out/*.pkg.tar.zst; do
              [ -e "${f}" ] || continue
              cp "${f}" out/
              n=$((n + 1))
            done
          done
          echo "count=${n}" >> "$GITHUB_OUTPUT"
          if [ "${n}" = 0 ]; then
            echo "nothing to publish -- no build produced packages" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          ls -1 out/ | sed 's/^/  /'

      - name: Publish to R2
        if: ${{ steps.collect.outputs.count != '0' }}
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          REPO_SIGNING_KEY: ${{ secrets.REPO_SIGNING_KEY }}
          REPO_SIGNING_KEY_PASSPHRASE: ${{ secrets.REPO_SIGNING_KEY_PASSPHRASE }}
        run: ./scripts/publish-r2.sh

      # Per product, and only after the packages are live: next-pkgrel.sh treats
      # tags as the floor of what has been published, so a premature tag is both
      # a false record and a burned pkgrel.
      - name: Tag and release
        if: ${{ steps.collect.outputs.count != '0' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rc=0
          for d in artifacts/product-*/; do
            [ -f "${d}version.env" ] || continue
            cp "${d}version.env" version.env
            p="$(. ./version.env >/dev/null 2>&1; printf '%s' "${_product}")"
            pb="$(. ./version.env >/dev/null 2>&1; printf '%s' "${_pkgbase}")"
            # A failed build still uploads its artifact (version.env, no
            # packages) so it stays inspectable. Nothing of it is live, so skip
            # the tag and keep going, to tag whichever product did publish.
            if ! ls "out/${pb}"-*.pkg.tar.zst >/dev/null 2>&1; then
              echo "==> ${p}: no packages published in this run; not tagging"
              continue
            fi
            echo "==> tagging ${p}"
            # Not fatal on the spot: products publish together but tag
            # independently, and aborting here would leave a product's packages
            # live in R2 with no tag because another one's push was rejected.
            # Tag everything, then fail.
            PRODUCT="${p}" ./scripts/tag-release.sh \
              || { echo "::error::${p}: tag/release failed"; rc=1; }
          done
          exit "${rc}"

      # No build-failure issue here: report-failure.sh reports a product's patch
      # stack, and a publish failure is not product-specific. It is recoverable by
      # construction -- packages upload before the database, so R2 stays
      # consistent and the packages are in the artifacts.
      - name: Note a publish failure
        if: failure()
        run: |
          {
            echo
            echo "### Publish failed"
            echo
            echo "R2 may be untouched or may hold packages the database does not"
            echo "reference yet, which is harmless. The packages are attached to"
            echo "this run as artifacts; re-running this workflow republishes them."
          } >> "$GITHUB_STEP_SUMMARY"
