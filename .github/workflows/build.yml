name: build

# Triggers, and what each is for:
#
#   workflow_dispatch  manual, plus the poller's `gh workflow run` -- a push made
#                      with GITHUB_TOKEN does not trigger other workflows, so the
#                      poller commits sources.env and then dispatches explicitly.
#   push               anything that changes what gets built: the pinned refs,
#                      the manifests, the config, the PKGBUILD, the scripts.
#                      Docs and READMEs deliberately do not trigger a kernel build.
on:
  workflow_dispatch:
    inputs:
      ogc_ref:
        description: 'OGC release tag to build (blank = use sources.env)'
        type: string
        default: ''
      base_version:
        description: 'Pin the mainline base (blank = derive from the OGC tag)'
        type: string
        default: ''
      skip_publish:
        description: 'Build only; do not touch R2, do not tag'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'sources.env'
      - 'PKGBUILD'
      - 'Dockerfile'
      - 'config/**'
      - 'devices/**'
      - 'patches/series.d/**'
      - 'patches/ogc.select'
      - 'patches/ogc.select.deny'
      - 'patches/ogc.keyfpr'
      - 'patches/local/**'
      # Only the scripts that change WHAT gets built. `scripts/**` was too broad:
      # editing publish-r2.sh to fix an upload bug rebuilt a byte-identical
      # kernel for fifty minutes before republishing it.
      #
      #   fetch-patches.sh       picks the base version and the patch stack
      #   build*.sh, makepkg-*   how it is compiled and packaged
      #   next-pkgrel.sh         sets pkgrel, which is baked into the package
      #
      # Deliberately absent: publish-r2.sh, tag-release.sh, report-failure.sh,
      # verify-repo.sh, setup-signing-key.sh, poll-sources.sh. Those act on a
      # package that already exists, or never run here at all.
      - 'scripts/fetch-patches.sh'
      - 'scripts/build.sh'
      - 'scripts/build-in-container.sh'
      - 'scripts/makepkg-and-report.sh'
      - 'scripts/next-pkgrel.sh'
      # NOT '.github/workflows/build.yml'. Editing this file changes how the
      # build is orchestrated, not what comes out of it, and most edits here are
      # to the publish half. check.yml validates every push cheaply; use
      # `gh workflow run build.yml` when a change genuinely needs a real build.

permissions:
  contents: write   # push tags, create releases
  issues: write     # open the build-failure issue

# One publisher at a time. cancel-in-progress is false on purpose: cancelling a
# job mid-publish could leave R2 holding packages with no database entry, or a
# database referencing a package whose upload was killed.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  build:
    # Native aarch64. Free for public repositories, and it means no qemu, no
    # binfmt, and no cross-compilation tax on a kernel build.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180

    steps:
      - uses: actions/checkout@v7

      # Weekly rotation of the builder image so its toolchain does not drift a
      # year behind the target, without rebuilding a rootfs on every run.
      - name: Cache key inputs
        id: keys
        run: echo "week=$(date -u +%Y-%U)" >> "$GITHUB_OUTPUT"

      # restore/save rather than actions/cache, throughout. actions/cache only
      # writes in its post step, and post steps do not run when the job fails --
      # so a failed publish at the very end discards an hour of compilation and
      # the retry starts cold. Publishing talks to an external service and is by
      # far the likeliest step to fail, which makes that exactly backwards.
      - name: Restore builder image
        id: imgcache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/builder-image.tar
          key: builder-${{ hashFiles('Dockerfile') }}-${{ steps.keys.outputs.week }}

      - name: Load or build the builder image
        run: |
          set -euo pipefail
          if [ -f ~/.cache/builder-image.tar ]; then
            docker load -i ~/.cache/builder-image.tar
          else
            docker build -t linux-handheld-builder:latest .
            mkdir -p ~/.cache
            docker save linux-handheld-builder:latest -o ~/.cache/builder-image.tar
          fi

      - name: Save builder image
        if: ${{ !cancelled() && steps.imgcache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/builder-image.tar
          key: builder-${{ hashFiles('Dockerfile') }}-${{ steps.keys.outputs.week }}

      - name: Install host tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          # No pacman on the runner. Both tools that needed it --
          # repo-add and vercmp -- now run inside the builder container, whose
          # pacman is the one that built these packages. Ubuntu ships 6.0.2
          # against Arch's 7.1.0, and that gap already cost one failed publish:
          # 6.0.2 does not know --include-sigs and treated the unknown option as
          # the database filename. vercmp is the same risk with worse
          # consequences, since it decides what gets deleted.
          #
          # bsdtar (libarchive-tools) is for fetch-patches.sh unpacking
          # series.zip; it falls back to unzip, which rclone needs anyway.
          sudo apt-get install -y -qq libarchive-tools unzip

          # rclone from upstream, pinned, NOT from apt. Ubuntu 24.04 ships
          # 1.60.1 -- an October 2022 build, four years behind, from before much
          # of the R2 compatibility work. The CreateBucket 501 is handled by
          # no-check-bucket in publish-r2.sh either way, but there is no reason
          # to talk to R2 through a client that old.
          #
          # Checksum-verified rather than piped from install.sh: this runs with
          # the repo signing key and R2 credentials in the environment.
          RCLONE_VER=v1.75.0
          RCLONE_SHA=d0ad88ba4c8e285b7c9efa591e0ab643280a91741e13c27f3a9c0957ccfa5203
          curl -fsSL --retry 3 -o /tmp/rclone.zip \
            "https://github.com/rclone/rclone/releases/download/${RCLONE_VER}/rclone-${RCLONE_VER}-linux-arm64.zip"
          echo "${RCLONE_SHA}  /tmp/rclone.zip" | sha256sum -c -
          unzip -q -j /tmp/rclone.zip "*/rclone" -d /tmp
          sudo install -m755 /tmp/rclone /usr/local/bin/rclone
          rclone version | head -1

      # The kernel tarball is 150 MB and identical across every build of one
      # base; caching it turns a base bump into the only run that downloads it.
      - name: Restore kernel tarball
        id: tarcache
        uses: actions/cache/restore@v6
        with:
          path: .cache
          key: tarball-${{ hashFiles('sources.env') }}
          restore-keys: tarball-

      - name: Resolve the patch stack
        id: fetch
        env:
          OGC_REF_OVERRIDE: ${{ inputs.ogc_ref }}
          BASE_VERSION_OVERRIDE: ${{ inputs.base_version }}
        run: ./scripts/fetch-patches.sh

      - name: Save kernel tarball
        if: ${{ !cancelled() && steps.tarcache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: .cache
          key: tarball-${{ hashFiles('sources.env') }}

      - name: Decide pkgrel
        id: ver
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: ./scripts/next-pkgrel.sh

      # Keyed on pkgver so a base bump starts clean rather than inheriting a
      # cache full of objects for a different kernel; restore-keys still lets an
      # armada-only rebuild reuse almost everything.
      - name: Restore ccache
        uses: actions/cache/restore@v6
        with:
          path: .ccache
          key: ccache-${{ steps.ver.outputs.pkgver }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ steps.ver.outputs.pkgver }}-
            ccache-

      - name: Build packages
        env:
          # build.sh defaults to 8G, which is right locally and wrong here.
          # GitHub allows 10 GB of Actions cache PER REPOSITORY, evicted LRU, and
          # the ccache key includes the commit sha -- so every push writes a new
          # entry rather than updating one. At 8G, the builder image (630 MB) and
          # kernel tarball (150 MB) plus a single ccache generation already fill
          # the budget, so the next push evicts the cache it was about to reuse
          # and every build stays cold. 2G holds a full kernel's objects with
          # room for several generations to coexist.
          CCACHE_MAXSIZE: 2G
        run: ./scripts/build.sh

      # Immediately after the build and before anything that can fail, because
      # this is the hour of work worth protecting.
      # !cancelled(), not always(). The point is still to save on FAILURE -- a
      # failed publish must not discard an hour of compilation -- but saving on
      # CANCELLATION is actively harmful here: restore-keys resolves to the most
      # recently created matching entry, so a build cancelled two minutes in
      # would store a near-empty ccache that then shadows the complete one from
      # the last successful build. It also makes a cancel wait for a 2 GB upload,
      # which GitHub warns about for always().
      - name: Save ccache
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: .ccache
          key: ccache-${{ steps.ver.outputs.pkgver }}-${{ github.sha }}

      - name: Job summary
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          [ -f .fetch-report.md ]  && cat .fetch-report.md  >> "$GITHUB_STEP_SUMMARY" || true
          [ -f .staged-report.md ] && cat .staged-report.md >> "$GITHUB_STEP_SUMMARY" || true
          if compgen -G 'out/*.pkg.tar.zst' > /dev/null; then
            {
              echo
              echo "### Packages"
              echo
              echo "| package | size |"
              echo "|---|---|"
              for f in out/*.pkg.tar.zst; do
                echo "| \`$(basename "$f")\` | $(du -h "$f" | cut -f1) |"
              done
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: packages-${{ steps.ver.outputs.pkgver }}-${{ steps.ver.outputs.pkgrel }}
          path: |
            out/*.pkg.tar.zst
            version.env
            patches/series.generated
          retention-days: 14

      # ---- publish ---------------------------------------------------------
      - name: Publish to R2
        if: ${{ !inputs.skip_publish }}
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          REPO_SIGNING_KEY: ${{ secrets.REPO_SIGNING_KEY }}
          REPO_SIGNING_KEY_PASSPHRASE: ${{ secrets.REPO_SIGNING_KEY_PASSPHRASE }}
        run: ./scripts/publish-r2.sh

      # Only after the packages are actually live. A tag that exists but was
      # never published would be the worst kind of provenance record: one that
      # looks authoritative and is not.
      - name: Tag and release
        if: ${{ !inputs.skip_publish }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/tag-release.sh

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: ./scripts/report-failure.sh
