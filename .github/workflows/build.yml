name: build

# workflow_dispatch also serves the poller: GITHUB_TOKEN pushes trigger no workflows.
on:
  workflow_dispatch:
    inputs:
      product:
        description: 'Product to build (blank = every product in sources.env)'
        type: string
        default: ''
      kernel_source:
        description: 'Override KERNEL_SOURCE for this run (cachyos / kernel.org)'
        type: string
        default: ''
      kernel_ref:
        description: 'Override the kernel ref for this run (cachyos-7.2.2-1, 7.2.2, ...)'
        type: string
        default: ''
      base_version:
        description: 'Pin the base version (kernel.org products only)'
        type: string
        default: ''
      use_ogc:
        description: 'Override USE_OGC for this run (yes/no) -- the overlap experiment'
        type: string
        default: ''
      skip_publish:
        description: 'Build only; do not touch R2, do not tag'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'sources.env'
      - 'products/**'
      - 'PKGBUILD'
      - 'Dockerfile'
      - 'config/**'
      - 'patches/series.d/**'
      - 'patches/*/*.patch'
      - 'patches/ogc.select'
      - 'patches/ogc.select.deny'
      - 'patches/ogc.keyfpr'
      # Only scripts that change the output; a publish-script fix must not rebuild the kernel.
      - 'scripts/lib-product.sh'
      - 'scripts/fetch-patches.sh'
      - 'scripts/build.sh'
      - 'scripts/build-in-container.sh'
      - 'scripts/makepkg-and-report.sh'
      - 'scripts/next-pkgrel.sh'
      # Not build.yml itself: it changes orchestration, not output; check.yml validates every push.

permissions:
  contents: write   # push tags, create releases
  issues: write     # open the build-failure issue
  actions: write    # delete superseded ccache entries (see the prune step)

# cancel-in-progress false: a cancelled publish could leave R2 and the database out of step.
concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  # Products and their kernel refs; the tarball cache is keyed on the ref.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - name: Resolve products and their kernel refs
        id: plan
        env:
          # Via env, never inline: an input pasted into a shell command is an injection.
          WANT: ${{ inputs.product }}
          KERNEL_SOURCE_OVERRIDE: ${{ inputs.kernel_source }}
          KERNEL_REF_OVERRIDE: ${{ inputs.kernel_ref }}
          BASE_VERSION_OVERRIDE: ${{ inputs.base_version }}
        run: |
          set -euo pipefail
          . ./sources.env
          if [ -n "${WANT}" ]; then
            [ -f "products/${WANT}.conf" ] \
              || { echo "::error::no products/${WANT}.conf"; exit 1; }
            list="${WANT}"
          else
            list="${PRODUCTS}"
          fi
          [ -n "${list}" ] || { echo "::error::no products to build"; exit 1; }

          # Same resolver as the build, so the cache key matches the download.
          for p in ${list}; do
            # set -e here too, or a refused lp_load still prints a half-loaded ref.
            ref="$(PRODUCT="${p}" bash -c '
                set -euo pipefail
                . scripts/lib-product.sh
                lp_load "$PWD" >/dev/null
                lp_resolve_kernel_source "" >/dev/null
                printf "%s" "${KERNEL_REF}"')" \
              || { echo "::error::${p}: product conf and overrides disagree (see above)"; exit 1; }
            [ -n "${ref}" ] || { echo "::error::could not resolve a kernel ref for ${p}"; exit 1; }
            printf '%s\t%s\n' "${p}" "${ref}"
          done > /tmp/plan.tsv
          sed 's/^/  /' /tmp/plan.tsv
          matrix="$(jq -Rn -c '[inputs | split("\t") | {product: .[0], kernelref: .[1]}]' < /tmp/plan.tsv)"
          echo "matrix=${matrix}" >> "$GITHUB_OUTPUT"
          echo "${matrix}"

  build:
    needs: plan
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    strategy:
      # fail-fast false: one broken stack must not cancel the other, and publish ships what built.
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.matrix) }}

    env:
      PRODUCT: ${{ matrix.product }}

    steps:
      # fetch-tags: next-pkgrel.sh floors pkgrel on tags. github.sha: publish must tag the tree it built.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-tags: true
          fetch-depth: 0

      # Weekly rotation keeps the builder's toolchain close to the target's.
      - name: Cache key inputs
        id: keys
        run: echo "week=$(date -u +%Y-%U)" >> "$GITHUB_OUTPUT"

      # restore/save, not actions/cache: its post-step save does not run when the job fails.
      - name: Restore builder image
        id: imgcache
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/builder-image.tar
          key: builder-${{ hashFiles('Dockerfile') }}-${{ steps.keys.outputs.week }}

      - name: Load or build the builder image
        run: |
          set -euo pipefail
          if [ -f ~/.cache/builder-image.tar ]; then
            docker load -i ~/.cache/builder-image.tar
          else
            docker build -t linux-handheld-builder:latest .
            mkdir -p ~/.cache
            docker save linux-handheld-builder:latest -o ~/.cache/builder-image.tar
          fi

      - name: Save builder image
        if: ${{ !cancelled() && steps.imgcache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: ~/.cache/builder-image.tar
          key: builder-${{ hashFiles('Dockerfile') }}-${{ steps.keys.outputs.week }}

      - name: Install host tools
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq libarchive-tools unzip
          # With PKGREL_REQUIRE_R2 a missing rclone is fatal.
          ./scripts/install-rclone.sh

      # Keyed on the kernel ref, so products on the same tag share one entry.
      - name: Restore kernel tarball
        id: tarcache
        uses: actions/cache/restore@v6
        with:
          path: .cache
          key: tarball-${{ matrix.kernelref }}

      - name: Resolve the patch stack
        id: fetch
        env:
          KERNEL_SOURCE_OVERRIDE: ${{ inputs.kernel_source }}
          KERNEL_REF_OVERRIDE: ${{ inputs.kernel_ref }}
          BASE_VERSION_OVERRIDE: ${{ inputs.base_version }}
          USE_OGC_OVERRIDE: ${{ inputs.use_ogc }}
        run: ./scripts/fetch-patches.sh

      - name: Save kernel tarball
        if: ${{ !cancelled() && steps.tarcache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: .cache
          key: tarball-${{ matrix.kernelref }}

      - name: Decide pkgrel
        id: ver
        env:
          # A string: `skip_publish && '' || '1'` fails because '' is falsy in an expression.
          PKGREL_REQUIRE_R2: ${{ !inputs.skip_publish }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: ./scripts/next-pkgrel.sh

      # Exact pkgver first, then any entry for the product (NOHASHDIR makes cross-base hits work).
      - name: Restore ccache
        uses: actions/cache/restore@v6
        with:
          path: .ccache
          key: ccache-${{ matrix.product }}-${{ steps.ver.outputs.pkgver }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ matrix.product }}-${{ steps.ver.outputs.pkgver }}-
            ccache-${{ matrix.product }}-

      - name: Build packages
        env:
          # A full kernel is ~4.5 GiB of ccache; two products at 3G fit the 10 GB budget only with the prune below.
          CCACHE_MAXSIZE: 3G
        run: ./scripts/build.sh

      # Right after the build. !cancelled(), not always(): a killed build's save would shadow the last full cache.
      - name: Save ccache
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: .ccache
          key: ccache-${{ matrix.product }}-${{ steps.ver.outputs.pkgver }}-${{ github.sha }}

      # Entries are immutable; unpruned, two products fill 10 GB in about two runs and LRU evicts.
      - name: Prune superseded ccache entries
        if: ${{ !cancelled() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          prefix="ccache-${PRODUCT}-"
          gh api --paginate "/repos/${GITHUB_REPOSITORY}/actions/caches?per_page=100" \
            --jq ".actions_caches[] | select(.key | startswith(\"${prefix}\")) | \"\(.created_at)\t\(.id)\t\(.key)\"" \
            | sort -r > /tmp/caches.tsv || true
          total="$(wc -l < /tmp/caches.tsv)"
          echo "  ${total} cache entr(ies) under ${prefix}"
          tail -n +2 /tmp/caches.tsv | while IFS=$'\t' read -r created id key; do
            echo "  delete ${key} (${created})"
            gh api -X DELETE "/repos/${GITHUB_REPOSITORY}/actions/caches/${id}" >/dev/null || true
          done

      - name: Job summary
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          echo "## ${PRODUCT}" >> "$GITHUB_STEP_SUMMARY"
          [ -f .fetch-report.md ]  && cat .fetch-report.md  >> "$GITHUB_STEP_SUMMARY" || true
          [ -f .staged-report.md ] && cat .staged-report.md >> "$GITHUB_STEP_SUMMARY" || true
          if compgen -G 'out/*.pkg.tar.zst' > /dev/null; then
            {
              echo
              echo "### Packages"
              echo
              echo "| package | size |"
              echo "|---|---|"
              for f in out/*.pkg.tar.zst; do
                echo "| \`$(basename "$f")\` | $(du -h "$f" | cut -f1) |"
              done
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # The packages plus the version.env tag-release.sh needs per product.
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() }}
        with:
          name: product-${{ matrix.product }}-${{ steps.ver.outputs.pkgver }}-${{ steps.ver.outputs.pkgrel }}
          path: |
            out/*.pkg.tar.zst
            version.env
            patches/series.generated
          retention-days: 14
          if-no-files-found: warn

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: ./scripts/report-failure.sh

  # One database write per run: concurrent publishes would drop each other's database entries.
  publish:
    needs: [plan, build]
    # !cancelled() overrides the needs-succeeded gate: skip when plan failed or build was skipped,
    # run when only some products failed.
    if: ${{ !cancelled() && !inputs.skip_publish && needs.plan.result == 'success' && needs.build.result != 'skipped' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-tags: true
          fetch-depth: 0

      - name: Cache key inputs
        id: keys
        run: echo "week=$(date -u +%Y-%U)" >> "$GITHUB_OUTPUT"

      # publish-r2.sh wants the container's repo-add and vercmp; the runner has no pacman.
      - name: Restore builder image
        uses: actions/cache/restore@v6
        with:
          path: ~/.cache/builder-image.tar
          key: builder-${{ hashFiles('Dockerfile') }}-${{ steps.keys.outputs.week }}

      - name: Load the builder image
        run: |
          set -euo pipefail
          if [ -f ~/.cache/builder-image.tar ]; then
            docker load -i ~/.cache/builder-image.tar
          else
            echo "::warning::no cached builder image; building it"
            docker build -t linux-handheld-builder:latest .
          fi

      - name: Install rclone
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq unzip
          ./scripts/install-rclone.sh

      # continue-on-error: with no artifacts this would bury the real failure; the collect count gates.
      - uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          pattern: product-*
          path: artifacts

      # Every product into one out/, so repo-add writes the database once.
      - name: Collect the packages
        id: collect
        run: |
          set -euo pipefail
          mkdir -p out
          n=0
          for d in artifacts/product-*/; do
            [ -d "${d}" ] || continue
            [ -f "${d}version.env" ] || { echo "::warning::${d} has no version.env; skipping"; continue; }
            for f in "${d}"out/*.pkg.tar.zst; do
              [ -e "${f}" ] || continue
              cp "${f}" out/
              n=$((n + 1))
            done
          done
          echo "count=${n}" >> "$GITHUB_OUTPUT"
          if [ "${n}" = 0 ]; then
            echo "nothing to publish -- no build produced packages" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          ls -1 out/ | sed 's/^/  /'

      - name: Publish to R2
        if: ${{ steps.collect.outputs.count != '0' }}
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          REPO_SIGNING_KEY: ${{ secrets.REPO_SIGNING_KEY }}
          REPO_SIGNING_KEY_PASSPHRASE: ${{ secrets.REPO_SIGNING_KEY_PASSPHRASE }}
        run: ./scripts/publish-r2.sh

      # Only after the packages are live: tags are next-pkgrel.sh's floor.
      - name: Tag and release
        if: ${{ steps.collect.outputs.count != '0' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rc=0
          for d in artifacts/product-*/; do
            [ -f "${d}version.env" ] || continue
            cp "${d}version.env" version.env
            p="$(. ./version.env >/dev/null 2>&1; printf '%s' "${_product}")"
            pb="$(. ./version.env >/dev/null 2>&1; printf '%s' "${_pkgbase}")"
            # A failed build still uploads version.env with no packages; nothing is live, so skip it.
            if ! ls "out/${pb}"-*.pkg.tar.zst >/dev/null 2>&1; then
              echo "==> ${p}: no packages published in this run; not tagging"
              continue
            fi
            echo "==> tagging ${p}"
            # Tag every product, then fail: aborting would leave live packages untagged.
            PRODUCT="${p}" ./scripts/tag-release.sh \
              || { echo "::error::${p}: tag/release failed"; rc=1; }
          done
          exit "${rc}"

      # No issue: packages upload before the database, so R2 stays consistent and a re-run republishes.
      - name: Note a publish failure
        if: failure()
        run: |
          {
            echo
            echo "### Publish failed"
            echo
            echo "R2 may be untouched or may hold packages the database does not"
            echo "reference yet, which is harmless. The packages are attached to"
            echo "this run as artifacts; re-running this workflow republishes them."
          } >> "$GITHUB_STEP_SUMMARY"
